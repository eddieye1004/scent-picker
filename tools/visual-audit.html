<!DOCTYPE html>
<!--
  visual-audit.html — 本地渲染核查页（不参与部署，只服务开发）

  它能证明什么：自动点完四步问卷，在真实浏览器引擎里逐元素量
  getBoundingClientRect，报告四类问题：
    · 横向溢出 / 元素越出视口
    · 文字 <12px
    · 可点元素触控尺寸 <44px（正文内联 <a> 按 WCAG 2.5.8 下限 24px）
    · 行内链接 / 文字被容器裁切
  静态截图与 DOM 桩都抓不到这些——尺寸只有渲染后才知道。

  它能覆盖什么：<style> 与布局的全部实测维度（含 390/768/1280 三档）。
  覆盖不了什么：hover/focus 的观感、触屏手感、真机字体渲染 —— 仍需人工。

  用法（配合本机 Edge 无头，puppeteer 自带 Chromium 在部分沙箱起不来）:
    node server.js 8123
    msedge --headless=new --disable-gpu --no-sandbox --user-data-dir=%TEMP%\\edge-audit ^
      --virtual-time-budget=12000 --window-size=390,1200 --dump-dom ^
      http://127.0.0.1:8123/tools/visual-audit.html | findstr /C:"FAIL" /C:"WARN" /C:"====="
  无 FAIL/WARN 输出即通过。窗口宽度改成 768 / 1280 各跑一遍。
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>visual audit</title>
<link rel="stylesheet" href="../styles.css">
<style>
  /* 报告区固定在底部，不参与被测布局 */
  #report {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999;
    max-height: 40vh; overflow: auto; margin: 0;
    background: #1c1917; color: #d8d2c8;
    font: 12px/1.6 ui-monospace, Consolas, monospace;
    padding: 10px 14px; white-space: pre-wrap;
  }
</style>
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <pre id="report">running…</pre>
  <script type="module">
    import '../app.js';

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    const waitFor = async (sel, tries = 120) => {
      for (let i = 0; i < tries; i++) {
        const n = document.querySelectorAll(sel);
        if (n.length) return n;
        await wait(40);
      }
      throw new Error('timeout waiting ' + sel);
    };

    const out = [];
    const say = (s) => out.push(s);

    function audit(label) {
      const vw = document.documentElement.clientWidth;
      const doc = document.documentElement;
      say(`===== ${label} | 视口 ${vw}px =====`);
      say(`横向溢出: ${doc.scrollWidth > vw + 1 ? 'FAIL +' + (doc.scrollWidth - vw) + 'px' : 'OK'}`);

      const outside = [];
      for (const el of document.querySelectorAll('body *')) {
        if (el.id === 'report') continue;
        const r = el.getBoundingClientRect();
        if (!r.width && !r.height) continue;
        if (r.right > vw + 1) outside.push(`${el.tagName.toLowerCase()}.${el.className || '-'} +${(r.right - vw).toFixed(0)}`);
        if (r.left < -1) outside.push(`${el.tagName.toLowerCase()}.${el.className || '-'} left=${r.left.toFixed(0)}`);
      }
      say(outside.length ? `越界元素: FAIL ${outside.slice(0, 5).join(' | ')}` : '越界元素: OK');

      const small = new Set();
      for (const el of document.querySelectorAll('body *')) {
        if (el.id === 'report' || el.children.length) continue;
        if (!el.textContent.trim()) continue;
        if (!el.getBoundingClientRect().height) continue;
        const fs = parseFloat(getComputedStyle(el).fontSize);
        if (fs < 12) small.add(`${el.tagName.toLowerCase()}.${el.className || '-'}=${fs}px`);
      }
      say(small.size ? `字号: FAIL <12px ${[...small].join(', ')}` : '字号: OK');

      const tiny = [];
      for (const el of document.querySelectorAll('button, a, input, .opt, .chip')) {
        const r = el.getBoundingClientRect();
        if (!r.width || !r.height) continue;
        // 本项目所有 <a> 都是正文/页脚里的文字链接，适用行内链接 24px 下限；
        // 其余独立控件按 44px。
        const need = el.tagName === 'A' ? 24 : 44;
        if (r.height < need) tiny.push(`${el.tagName.toLowerCase()}.${el.className || '-'} h=${r.height.toFixed(0)}<${need}`);
      }
      say(tiny.length ? `触控尺寸: FAIL ${tiny.slice(0, 4).join(', ')}` : '触控尺寸: OK');

      say('');
    }

    (async () => {
      try {
        await wait(200);
        let opts = await waitFor('.opt');
        audit('step1 情绪');
        opts[0].click(); await wait(220);

        opts = await waitFor('.opt');
        audit('step2 场合');
        opts[1].click(); await wait(220);

        audit('step3 浓度');
        const slider = document.querySelector('input[type="range"]');
        slider.value = '2';
        slider.dispatchEvent(new Event('input', { bubbles: true }));
        await wait(120);
        [...document.querySelectorAll('.btn')].find((b) => b.textContent.includes('下一步')).click();
        await wait(260);

        const chips = await waitFor('.chip');
        audit('step4 香调');
        const berg = [...chips].find((c) => c.textContent.includes('佛手柑'));
        (berg || chips[0]).click();
        await wait(150);
        [...document.querySelectorAll('.btn')].find((b) => b.textContent.includes('看推荐')).click();
        await wait(520);

        audit('result 结果页');
        document.getElementById('report').textContent = out.join('\n');
        document.title = 'AUDIT_DONE';
      } catch (e) {
        document.getElementById('report').textContent = out.join('\n') + '\nAUDIT_ERROR ' + e.message;
        document.title = 'AUDIT_DONE';
      }
    })();
  </script>
</body>
</html>
